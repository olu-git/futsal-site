name: Refresh Public Competition Snapshot

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-snapshot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check target branch and public configuration
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            master) ;;
            *) echo "Snapshot refresh is not allowed on this ref." >&2; exit 1 ;;
          esac
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Required public Supabase repository variables are missing." >&2
            exit 1
          fi
          node --input-type=module -e 'if (new URL(process.env.NEXT_PUBLIC_SUPABASE_URL).hostname !== "gaqevgjgolvndhcycxzt.supabase.co") { console.error("Public Supabase Actions variables do not target production fis."); process.exit(1); } console.log("Production Supabase Actions variables verified.");'

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate snapshot
        run: |
          npm run snapshot:generate
          npm run snapshot:validate

      - name: Detect snapshot change
        id: snapshot
        shell: bash
        run: |
          if git diff --quiet -- src/data/public-competition-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm generated snapshot still matches published data
        if: steps.snapshot.outputs.changed == 'true'
        run: npm run snapshot:check

      - name: Run expensive snapshot checks only when changed
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          npm test
          npm run finals:check

      - name: Check whitespace
        run: git diff --check

      - name: Guard changed files
        shell: bash
        run: |
          changed="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changed" ] && [ "$changed" != ' M src/data/public-competition-snapshot.json' ]; then
            echo "Snapshot generation changed an unexpected file." >&2
            exit 1
          fi

      - name: Transfer validated snapshot
        if: steps.snapshot.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: published-competition-snapshot
          path: src/data/public-competition-snapshot.json
          if-no-files-found: error

  commit:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Reject a changed target branch
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download validated snapshot
        uses: actions/download-artifact@v4
        with:
          name: published-competition-snapshot
          path: src/data

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          test "$(git status --porcelain --untracked-files=all)" = ' M src/data/public-competition-snapshot.json'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/public-competition-snapshot.json
          test "$(git diff --cached --name-only)" = 'src/data/public-competition-snapshot.json'
          git diff --cached --check
          git commit -m "chore: refresh published competition snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
